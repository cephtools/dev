<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ceph PR Radar</title>
  <meta name="description" content="Trending and technically important pull requests in ceph/ceph.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6.5' fill='none' stroke='%23d14' stroke-width='2'/%3E%3Ccircle cx='8' cy='8' r='2' fill='%23d14'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/render.js">
  <link rel="modulepreload" href="js/state.js">
  <link rel="modulepreload" href="js/format.js">
  <!-- build:boot -->
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-pr" viewBox="0 0 16 16"><circle cx="4" cy="3.5" r="1.8"/><circle cx="4" cy="12.5" r="1.8"/><circle cx="12" cy="12.5" r="1.8"/><path d="M4 5.3v5.4M12 10.7V7a2 2 0 0 0-2-2H8.3M10 3 8 5l2 2"/></symbol>
    <symbol id="i-merged" viewBox="0 0 16 16"><circle cx="4" cy="3.5" r="1.8"/><circle cx="4" cy="12.5" r="1.8"/><circle cx="12" cy="9" r="1.8"/><path d="M4 5.3v5.4M4 5.3C4 7.8 6 9 10.2 9"/></symbol>
    <symbol id="i-pr-closed" viewBox="0 0 16 16"><circle cx="4" cy="3.5" r="1.8"/><circle cx="4" cy="12.5" r="1.8"/><circle cx="12" cy="12.5" r="1.8"/><path d="M4 5.3v5.4M12 10.7V8M10.3 2.3l3.4 3.4M13.7 2.3l-3.4 3.4"/></symbol>
    <symbol id="i-comment" viewBox="0 0 16 16"><path d="M2 3a1.5 1.5 0 0 1 1.5-1.5h9A1.5 1.5 0 0 1 14 3v6.5a1.5 1.5 0 0 1-1.5 1.5H6.5l-3 2.8V11h-.5A1.5 1.5 0 0 1 2 9.5z"/></symbol>
    <symbol id="i-review" viewBox="0 0 16 16"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></symbol>
    <symbol id="i-push" viewBox="0 0 16 16"><path d="M8 11V2.5M4.5 6 8 2.5 11.5 6M3 13.5h10"/></symbol>
    <symbol id="i-diff" viewBox="0 0 16 16"><path d="M4.5 2v5M2 4.5h5M9 12h5"/></symbol>
  </svg>
  <a class="skip" href="#view">Skip to results</a>
  <header class="top">
    <div class="brand">
      <h1><a href="#/trending" title="Home: trending view, filters reset">Ceph PR Radar</a></h1>
      <p id="data-status" class="data-status" aria-live="polite">Loading…</p>
    </div>
    <nav aria-label="Views">
      <a href="#/trending" data-view="trending">Trending</a>
      <a href="#/technical" data-view="technical">Technical importance</a>
      <a href="#/subsystems" data-view="subsystems">Subsystems</a>
      <a href="#/about" data-view="about">About / Scoring</a>
    </nav>
  </header>

  <div id="banners" class="banners"></div>

  <form id="filters" class="filters" aria-label="Filters" role="search">
    <label class="f-q">Search <input type="search" name="q" placeholder="title, #number, author" autocomplete="off"></label>
    <label>Subsystem <select name="sub"><option value="">All</option></select></label>
    <label>Author <input type="text" name="author" list="authors" placeholder="any" autocomplete="off"></label>
    <datalist id="authors"></datalist>
    <label>Label <select name="label"><option value="">All</option></select></label>
    <label>Status
      <select name="status">
        <optgroup label="Open">
          <option value="open">All open</option>
          <option value="ready">Ready for review</option>
          <option value="draft">Draft</option>
        </optgroup>
        <optgroup label="Recently merged or closed" data-closed>
          <option value="done">Merged + closed</option>
          <option value="merged">Merged</option>
          <option value="closed">Closed, not merged</option>
        </optgroup>
        <option value="all">All: open + merged + closed</option>
      </select>
    </label>
    <label title="Time window for displayed activity counts and activity-based sorting">Window <select name="win"><option value="7d">7d</option></select></label>
    <label class="f-min" title="Minimum score for this view">Min score <input type="number" name="min" min="0" step="1" inputmode="numeric"></label>
    <label class="f-sort">Sort <select name="sort"></select></label>
    <label class="check"><input type="checkbox" name="active" value="1"> Active in window</label>
    <label class="check"><input type="checkbox" name="backports" value="1"> Include backports</label>
    <button type="reset">Reset</button>
  </form>

  <main>
    <p id="result-count" class="result-count" aria-live="polite"></p>
    <div id="view" tabindex="-1"></div>
  </main>

  <dialog id="detail" aria-labelledby="detail-title">
    <div id="detail-content"></div>
  </dialog>

  <footer class="foot">
    Static dashboard built from the public GitHub API. Scores are heuristics; see <a href="#/about">About / Scoring</a>.
  </footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
