name: Update dashboard

# Collects PR data on a schedule, persists collector state on the data branch and
# deploys the static site to GitHub Pages. If collection fails, the previous dataset
# is redeployed with status.json reporting the failure, and the run is marked failed.

on:
  schedule:
    - cron: '17 */3 * * *' # every 3h; keep site.refreshHours in config/dashboard.json in sync
  workflow_dispatch:
    inputs:
      max_details:
        description: 'Max PR detail fetches this run (blank = config default)'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['site/**', 'src/**', 'config/**', 'schema/**', '.github/workflows/update.yml']

permissions:
  contents: write # push collector state to the data branch
  pages: write # deploy to GitHub Pages
  id-token: write # required by actions/deploy-pages

concurrency:
  group: dashboard-update
  cancel-in-progress: false

env:
  DATA_BRANCH: dashboard-data

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Restore collector state
        id: restore
        run: |
          mkdir -p state
          if git fetch --depth=1 origin "$DATA_BRANCH"; then
            git archive FETCH_HEAD | tar -x -C state
            echo "Restored state from $DATA_BRANCH"
          else
            echo "No $DATA_BRANCH branch yet; starting with empty state"
          fi

      # Push events only redeploy the site with the existing data.
      - name: Collect PR data
        id: collect
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          # A fine-grained PAT (public repositories, read-only) raises the GraphQL budget
          # from 1,000 to 5,000 points/hour. GITHUB_TOKEN is enough for normal operation.
          GITHUB_TOKEN: ${{ secrets.PR_DASH_TOKEN || github.token }}
          PR_DASH_REPO: ${{ vars.PR_DASH_REPO }}
          MAX_DETAILS: ${{ inputs.max_details }}
        run: node src/cli/collect.ts --state state ${MAX_DETAILS:+--max-details "$MAX_DETAILS"}

      - name: Save collector state
        if: github.event_name != 'push' && hashFiles('state/public/status.json') != ''
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          # One orphan commit, force-pushed: the data branch never accumulates history.
          export GIT_INDEX_FILE="$RUNNER_TEMP/state-index"
          git --work-tree=state add -A
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "Dashboard data $(date -u +%Y-%m-%dT%H:%MZ) (run ${{ github.run_id }})")
          git push --force origin "$commit:refs/heads/$DATA_BRANCH"

      - name: Build site
        run: node src/cli/build-site.ts --data state/public --out dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Fail run if collection failed
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::PR collection failed; the previous dataset was redeployed with a failure banner. See the 'Collect PR data' step."
          exit 1
